<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Miner Official Site</title>

    <link rel="stylesheet" href="official.css" />
  </head>

  <body>
    <div id="backgroundLayer"></div>

    <main>
      <section id="hero">
        <img
          src="Miner image/background/Miner-logo.png"
          alt="Miner"
          id="logo"
        />

        <p class="catchCopy">採掘チームの中に潜む盗賊を見抜け。</p>

        <a href="game.html">
          <button class="mainButton">ゲーム開始</button>
        </a>
      </section>

      <section class="panel">
        <h2>Minerとは？</h2>

        <p>
          Minerは採掘結果と議論をもとに、 盗賊陣営を見抜く正体隠匿型ゲームです。
        </p>

        <p>
          リーダーは採掘メンバーを選出し、
          市民陣営はプロジェクト成功を目指します。
        </p>
      </section>

      <section class="panel">
        <h2>ゲームの特徴</h2>

        <h3>⛏️ 採掘</h3>

        <p>採掘結果がゲーム展開に大きく影響します。</p>

        <h3>🕵️ 推理</h3>

        <p>調査システムや噂を利用して 盗賊陣営を追い詰めます。</p>

        <h3>🤝 駆け引き</h3>

        <p>リーダー、盗賊、共犯者の思惑が交差します。</p>
      </section>

      <section class="panel">
        <h2>更新履歴</h2>

        <pre id="changelog">

         読み込み中...

        </pre>
      </section>
    </main>
    <script>
      fetch("CHANGELOG.md")
        .then((response) => response.text())

        .then((text) => {
          document.getElementById("changelog").innerText = text;
        })

        .catch((error) => {
          document.getElementById("changelog").innerText =
            "更新履歴を読み込めませんでした。";
        });
    </script>
  </body>
</html>
