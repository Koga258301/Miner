<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Miner Official Site</title>

    <link rel="stylesheet" href="official.css" />
  </head>

  <body>
    <div id="backgroundLayer"></div>

    <main>
      <section id="hero">
        <img
          src="Miner image/background/Miner-logo.png"
          alt="Miner"
          id="logo"
        />

        <p class="catchCopy">採掘チームの中に潜む盗賊を見抜け</p>

        <a href="game.html">
          <button class="mainButton">Minerを遊ぶ</button>
        </a>
      </section>

      <section class="panel">
        <h2>Minerとは？</h2>

        <p>
          Minerは採掘結果と議論をもとに、 盗賊陣営を見抜く正体隠匿型ゲームです。
        </p>

        <p>
          リーダーは採掘メンバーを選出し、
          市民陣営はプロジェクト成功を目指します。
        </p>
      </section>

      <section class="panel">
        <h2>ゲームの特徴</h2>

        <h3>⛏️ 採掘</h3>

        <p>採掘結果がゲーム展開に大きく影響します。</p>

        <h3>🕵️ 推理</h3>

        <p>納品数や調査システムを利用して 盗賊陣営を見抜きます。</p>

        <h3>🤝 駆け引き</h3>

        <p>
          市民陣営は裏切り者を暴き、盗賊陣営は正体がばれないように失敗を目指しましょう。
        </p>
      </section>
      <section class="panel">
        <h2>開発者</h2>

        <p>感想や不具合報告は X（Twitter）までお願いします。</p>

        <p>
          <a href="https://x.com/kuramu_minsei" target="_blank">
            つれかな @kuramu_minsei
          </a>
        </p>
      </section>
      <a href="changelog.html">
        <button class="subButton">更新履歴</button>
      </a>
    </main>
  </body>
</html>
